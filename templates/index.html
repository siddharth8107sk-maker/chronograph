    function drawTreeSVG() {
      const svg = document.getElementById('tree-svg');
      if (!svg || !AppState.treeData) return;

      const nodes = AppState.treeViewMode === 'avl' ? AppState.treeData.avl_nodes : AppState.treeData.bst_nodes;
      if (!nodes || nodes.length === 0) {
        svg.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#6B7280">Tree is empty</text>`;
        return;
      }

      svg.innerHTML = '';
      const nodeMap = {};
      nodes.forEach(n => nodeMap[n.id] = n);

      // Find root (node not referenced as child)
      const childIds = new Set();
      nodes.forEach(n => {
        if (n.left_id) childIds.add(n.left_id);
        if (n.right_id) childIds.add(n.right_id);
      });
      const root = nodes.find(n => !childIds.has(n.id)) || nodes[0];

      // In-order traversal to calculate X coordinates
      let orderIndex = 0;
      const positions = {};

      function computeLayout(currId, depth) {
        if (!currId || !nodeMap[currId]) return;
        const n = nodeMap[currId];
        computeLayout(n.left_id, depth + 1);
        positions[n.id] = {
          x: 40 + orderIndex * 46,
          y: 40 + depth * 55,
          node: n
        };
        orderIndex++;
        computeLayout(n.right_id, depth + 1);
      }
      computeLayout(root.id, 0);

      // Adjust svg width if needed
      const totalWidth = Math.max(800, orderIndex * 46 + 80);
      svg.setAttribute('width', totalWidth);

      // Draw edges
      nodes.forEach(n => {
        const parentPos = positions[n.id];
        if (!parentPos) return;

        ['left_id', 'right_id'].forEach(childKey => {
          const cid = n[childKey];
          if (cid && positions[cid]) {
            const childPos = positions[cid];
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', parentPos.x);
            line.setAttribute('y1', parentPos.y);
            line.setAttribute('x2', childPos.x);
            line.setAttribute('y2', childPos.y);
            line.setAttribute('class', 'tree-edge');
            line.setAttribute('id', `edge-${n.id}-${cid}`);
            svg.appendChild(line);
          }
        });
      });

      // Draw nodes
      nodes.forEach(n => {
        const pos = positions[n.id];
        if (!pos) return;

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'tree-node');
        g.setAttribute('id', `node-g-${n.id}`);

        // Balance factor badge color
        const bf = n.balance !== undefined ? n.balance : 0;
        let strokeCol = '#10B981';
        let fillCol = '#ECFDF5';
        if (bf !== 0) {
          strokeCol = '#3B82F6';
          fillCol = '#EFF6FF';
        }
        if (Math.abs(bf) > 1) { // Violates AVL (shown in red for BST)
          strokeCol = '#EF4444';
          fillCol = '#FEE2E2';
        }

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x);
        circle.setAttribute('cy', pos.y);
        circle.setAttribute('r', '16');
        circle.setAttribute('fill', fillCol);
        circle.setAttribute('stroke', strokeCol);
        circle.setAttribute('id', `node-circle-${n.id}`);
        g.appendChild(circle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos.x);
        text.setAttribute('y', pos.y + 1);
        text.setAttribute('fill', '#111827');
        text.textContent = n.id.replace('EVT-', '');
        g.appendChild(text);

        // Subtitle badge for balance factor
        const bfText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        bfText.setAttribute('x', pos.x + 12);
        bfText.setAttribute('y', pos.y - 12);
        bfText.setAttribute('font-size', '9px');
        bfText.setAttribute('font-weight', '700');
        bfText.setAttribute('fill', strokeCol);
        bfText.textContent = bf >= 0 ? `+${bf}` : `${bf}`;
        g.appendChild(bfText);

        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${n.id}: ${n.name}\nStart min: ${n.start}, End: ${n.end}\nMaxEnd: ${n.max_end}, MaxGap: ${n.max_gap}`;
        g.appendChild(title);

        svg.appendChild(g);
      });
    }

    function runTreeTraversal(type) {
      if (!AppState.treeData || !AppState.treeData.traversals) return;
      const order = AppState.treeData.traversals[type] || [];
      const speed = parseInt(document.getElementById('traversal-speed').value) || 350;
      const display = document.getElementById('traversal-display');

      display.innerHTML = `<strong>${type.toUpperCase()}:</strong> `;

      // Reset any previous highlights
      document.querySelectorAll('.tree-node circle').forEach(c => c.classList.remove('traversal-highlight'));

      let idx = 0;
      if (AppState.traversalTimer) clearInterval(AppState.traversalTimer);

      AppState.traversalTimer = setInterval(() => {
        if (idx >= order.length) {
          clearInterval(AppState.traversalTimer);
          return;
        }

        const nid = order[idx];
        const circle = document.getElementById(`node-circle-${nid}`);
        if (circle) {
          circle.classList.add('traversal-highlight');
          setTimeout(() => circle.classList.remove('traversal-highlight'), speed * 0.9);
        }

        const tag = document.createElement('span');
        tag.className = 'badge badge-outline mono';
        tag.style.marginRight = '4px';
        tag.textContent = nid;
        display.appendChild(tag);

        idx++;
      }, speed);
    }

    async function loadBenchmarkData(suite) {
      const area = document.getElementById('benchmark-content-area');
      area.innerHTML = `<div style="text-align:center; padding: 50px 0; color:var(--text-muted);">Executing pure Python benchmark suite '${suite}'... Please hold.</div>`;

      const res = await apiRequest(`/api/benchmark?suite=${suite}`);
      if (!res.ok || !res.data) {
        area.innerHTML = `<div class="card" style="color:var(--danger);">Benchmark failed: ${res.error}</div>`;
        return;
      }

      lastBenchmarkData = res.data;
      const data = res.data.results;
      const conclusion = res.data.conclusion;

      area.innerHTML = `
        <div class="card">
          <h3 style="font-size: 16px; font-weight:600; margin-bottom: 12px;">Visual Performance Chart</h3>
          <div class="svg-canvas-container" style="min-height: 380px;">
            <svg id="benchmark-chart-svg" style="width:100%; height:380px; display:block;"></svg>
          </div>
          <div style="margin-top: 14px; padding: 12px 16px; background:#F0FDF4; border:1px solid #BBF7D0; border-radius:8px; font-size:13px; color:#166534;">
            <strong>Empirical Finding:</strong> ${escapeHtml(conclusion)}
          </div>
        </div>

        <div class="card">
          <h3 style="font-size: 16px; font-weight:600; margin-bottom: 14px;">Raw Benchmark Metrics</h3>
          <div class="table-container" id="benchmark-raw-table"></div>
        </div>
      `;

      drawBenchmarkChart(suite, data);
      renderRawMetricsTable(suite, data);
    }

    function drawBenchmarkChart(suite, data) {
      const svg = document.getElementById('benchmark-chart-svg');
      if (!svg) return;
      svg.innerHTML = '';

      const w = svg.clientWidth || 700;
      const h = 380;
      const padL = 60, padR = 40, padT = 30, padB = 40;
      const chartW = w - padL - padR;
      const chartH = h - padT - padB;

      if (suite === 'tree') {
        // Draw Height Comparison across sorted pattern
        const sizes = data.sizes;
        const sortedData = data.data.sorted;
        const avlH = sortedData.avl_height;
        const bstH = sortedData.bst_height;

        let maxVal = Math.max(...bstH, ...avlH, 1);
        if (benchmarkLogScale) maxVal = Math.log10(maxVal + 1);

        // Axes
        drawAxes(svg, padL, padT, chartW, chartH, sizes, maxVal);

        // Polylines
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, bstH, maxVal, '#DC2626', 'BST Height (Sorted)');
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, avlH, maxVal, '#16A34A', 'AVL Height (Sorted)');

      } else if (suite === 'sort') {
        const sizes = data.sizes;
        const mrg = data.merge_sort_ms;
        const ins = data.insertion_sort_ms;
        const bub = data.bubble_sort_ms;

        let maxVal = Math.max(...bub, ...ins, ...mrg, 1);
        if (benchmarkLogScale) maxVal = Math.log10(maxVal + 1);

        drawAxes(svg, padL, padT, chartW, chartH, sizes, maxVal);
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, bub, maxVal, '#DC2626', 'Bubble Sort');
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, ins, maxVal, '#D97706', 'Insertion Sort');
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, mrg, maxVal, '#16A34A', 'Merge Sort');

      } else if (suite === 'search') {
        const sizes = data.sizes;
        const lin = data.linear_search_ms;
        const bin = data.binary_search_ms;
        const avl = data.avl_search_ms;
        const hsh = data.hash_lookup_ms;

        let maxVal = Math.max(...lin, 0.05);
        if (benchmarkLogScale) maxVal = Math.log10(maxVal + 1);

        drawAxes(svg, padL, padT, chartW, chartH, sizes, maxVal);
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, lin, maxVal, '#DC2626', 'Linear Search');
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, avl, maxVal, '#2563EB', 'AVL Search');
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, bin, maxVal, '#D97706', 'Binary Search');
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, hsh, maxVal, '#16A34A', 'Hash Lookup');

      } else if (suite === 'slot') {
        const sizes = data.sizes;
        const prn = data.avl_gap_pruned_ms;
        const scn = data.linear_scan_ms;

        let maxVal = Math.max(...scn, ...prn, 1);
        if (benchmarkLogScale) maxVal = Math.log10(maxVal + 1);

        drawAxes(svg, padL, padT, chartW, chartH, sizes, maxVal);
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, scn, maxVal, '#DC2626', 'Linear Scan');
        drawLinePlot(svg, padL, padT, chartW, chartH, sizes.length, prn, maxVal, '#16A34A', 'AVL max_gap Pruned');
      }
    }

    function drawAxes(svg, padL, padT, w, h, xLabels, maxVal) {
      // Y axis
      const yLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      yLine.setAttribute('x1', padL); yLine.setAttribute('y1', padT);
      yLine.setAttribute('x2', padL); yLine.setAttribute('y2', padT + h);
      yLine.setAttribute('stroke', '#CBD5E1');
      svg.appendChild(yLine);

      // X axis
      const xLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      xLine.setAttribute('x1', padL); yLine.setAttribute('y1', padT + h);
      xLine.setAttribute('x2', padL + w); xLine.setAttribute('y2', padT + h);
      xLine.setAttribute('stroke', '#CBD5E1');
      svg.appendChild(xLine);

      // Grid lines & labels
      for (let i = 0; i <= 4; i++) {
        const y = padT + h - (i / 4) * h;
        const val = benchmarkLogScale ? Math.pow(10, (i / 4) * maxVal) - 1 : (i / 4) * maxVal;
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', padL - 8);
        txt.setAttribute('y', y + 4);
        txt.setAttribute('text-anchor', 'end');
        txt.setAttribute('font-size', '10px');
        txt.setAttribute('fill', '#6B7280');
        txt.textContent = val > 100 ? Math.round(val) : val.toFixed(2);
        svg.appendChild(txt);

        const grid = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        grid.setAttribute('x1', padL); grid.setAttribute('y1', y);
        grid.setAttribute('x2', padL + w); grid.setAttribute('y2', y);
        grid.setAttribute('stroke', '#F1F5F9');
        grid.setAttribute('stroke-dasharray', '2,2');
        svg.appendChild(grid);
      }

      // X labels
      xLabels.forEach((lbl, i) => {
        const x = padL + (i / (xLabels.length - 1)) * w;
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', x);
        txt.setAttribute('y', padT + h + 20);
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('font-size', '10px');
        txt.setAttribute('fill', '#6B7280');
        txt.textContent = lbl;
        svg.appendChild(txt);
      });
    }

    function drawLinePlot(svg, padL, padT, w, h, count, points, maxVal, color, label) {
      let d = '';
      points.forEach((val, i) => {
        const normalized = benchmarkLogScale ? Math.log10(val + 1) : val;
        const x = padL + (i / (count - 1)) * w;
        const y = padT + h - (normalized / maxVal) * h;
        d += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);

        const pt = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        pt.setAttribute('cx', x);
        pt.setAttribute('cy', y);
        pt.setAttribute('r', '4');
        pt.setAttribute('fill', color);
        svg.appendChild(pt);
      });

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '2.5');
      svg.appendChild(path);
    }

    function renderRawMetricsTable(suite, data) {
      const el = document.getElementById('benchmark-raw-table');
      if (!el) return;

      if (suite === 'tree') {
        const p = data.data.sorted;
        el.innerHTML = `
          <table class="data-table mono">
            <thead>
              <tr><th>Size (N)</th><th>AVL Height</th><th>BST Height</th><th>AVL Insert (ms)</th><th>BST Insert (ms)</th><th>AVL Conflict (ms)</th></tr>
            </thead>
            <tbody>
              ${data.sizes.map((n, i) => `
                <tr>
                  <td>${n}</td>
                  <td style="color:var(--success); font-weight:600;">${p.avl_height[i]}</td>
                  <td style="color:var(--danger); font-weight:600;">${p.bst_height[i]}</td>
                  <td>${p.avl_insert_ms[i]}</td>
                  <td>${p.bst_insert_ms[i]}</td>
                  <td>${p.avl_conflict_ms[i]}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else if (suite === 'sort') {
        el.innerHTML = `
          <table class="data-table mono">
            <thead>
              <tr><th>Size (N)</th><th>Merge Sort (ms)</th><th>Insertion Sort (ms)</th><th>Bubble Sort (ms)</th><th>Selection Sort (ms)</th></tr>
            </thead>
            <tbody>
              ${data.sizes.map((n, i) => `
                <tr>
                  <td>${n}</td>
                  <td style="color:var(--success); font-weight:600;">${data.merge_sort_ms[i]}</td>
                  <td>${data.insertion_sort_ms[i]}</td>
                  <td>${data.bubble_sort_ms[i]}</td>
                  <td>${data.selection_sort_ms[i]}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else if (suite === 'search') {
        el.innerHTML = `
          <table class="data-table mono">
            <thead>
              <tr><th>Size (N)</th><th>Hash Lookup (ms)</th><th>AVL Search (ms)</th><th>Binary Search (ms)</th><th>Linear Search (ms)</th></tr>
            </thead>
            <tbody>
              ${data.sizes.map((n, i) => `
                <tr>
                  <td>${n}</td>
                  <td style="color:var(--success); font-weight:600;">${data.hash_lookup_ms[i]}</td>
                  <td>${data.avl_search_ms[i]}</td>
                  <td>${data.binary_search_ms[i]}</td>
                  <td>${data.linear_search_ms[i]}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else if (suite === 'slot') {
        el.innerHTML = `
          <table class="data-table mono">
            <thead>
              <tr><th>Size (N)</th><th>AVL max_gap Pruned (ms)</th><th>Linear Scan (ms)</th><th>Speedup</th></tr>
            </thead>
            <tbody>
              ${data.sizes.map((n, i) => {
                const spd = (data.linear_scan_ms[i] / (data.avl_gap_pruned_ms[i] || 0.001)).toFixed(1);
                return `
                  <tr>
                    <td>${n}</td>
                    <td style="color:var(--success); font-weight:600;">${data.avl_gap_pruned_ms[i]}</td>
                    <td>${data.linear_scan_ms[i]}</td>
                    <td style="font-weight:700;">${spd}x</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      }
    }

    function exportBenchmarkCSV() {
      if (!lastBenchmarkData) {
        showToast('No benchmark data to export', 'error');
        return;
      }
      const json = JSON.stringify(lastBenchmarkData.results, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `chronograph_benchmark_${benchmarkActiveSuite}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Exported benchmark dataset!', 'success');
    }

    // Helper utilities
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeQuotes(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
